# CI — Lint + Tests del DocScan Desktop
#
# Trigger: push a main / ramas feature-* / fix-* y pull requests.
# Ejecuta ruff (lint + formato) sobre el código fuente desktop y la suite
# de tests (excluyendo los tests de la web SaaS archivada y el test de
# escáner que requiere hardware SANE real).

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.14'
  # Plataforma Qt sin display para pytest-qt en runners headless.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsane-dev \
            libzbar0 \
            tesseract-ocr \
            tesseract-ocr-spa \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxcb-cursor0

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint (código fuente)
        run: ruff check app/ main.py docscan_worker/ config/

      - name: Ruff format check (código fuente)
        run: ruff format --check app/ main.py docscan_worker/ config/

      - name: Pytest (suite desktop)
        # Los tests de la web archivada (test_web_*, test_arq_*,
        # test_pipeline_runner_events) se autodescartan en tests/conftest.py
        # cuando faltan sus dependencias (fastapi/bcrypt/arq), ausentes en el
        # entorno desktop. No hace falta enumerarlos aquí.
        run: pytest -q
