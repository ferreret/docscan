[pytest]
# Solo se recolectan tests de tests/. Evita que pytest intente recolectar
# los ficheros de producción con prefijo test_ (app/pipeline/test_executor.py,
# app/workers/test_pipeline_worker.py), que NO son tests.
testpaths = tests

# Un cuelgue (p.ej. un modal Qt sin mockear o SANE esperando hardware) se
# convierte en fallo con nombre en vez de bloquear la suite completa.
# 120s es holgado: el test de SANE real tarda ~33s; un cuelgue es infinito.
addopts = --timeout=120 --timeout-method=thread

markers =
    slow: tests lentos que tocan hardware o E/S real (p.ej. enumeración SANE)
