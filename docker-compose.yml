# Stack completo de desarrollo de DocScan Studio Web.
#
# Servicios:
#   db      — PostgreSQL 16 con volumen persistente
#   minio   — S3-compatible, pensado para reemplazar el storage filesystem
#   redis   — cola para ARQ (futuros background tasks más grandes)
#   api     — la API REST FastAPI construida desde Dockerfile.web
#
# Uso:
#   cp web/.env.example .env    # rellenar todas las variables obligatorias
#   docker compose up --build
#
# NOTA DE SEGURIDAD: este fichero usa la sintaxis `${VAR:?mensaje}` para
# todas las credenciales. Si alguna no está definida en el `.env`, compose
# se niega a arrancar en vez de usar un valor por defecto predecible.
#
# Las migraciones Alembic se aplican automáticamente al arrancar `api`
# (ver docker-bootstrap-db.py).

services:
  db:
    image: postgres:16-alpine
    container_name: docscan-web-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: docscan-web-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?define MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?define MINIO_ROOT_PASSWORD en .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # Consola web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docscan-web-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: docscan-web-api
    restart: unless-stopped
    environment:
      # Base de datos — apunta al servicio `db` de la red interna
      DOCSCAN_WEB_DATABASE__URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      # JWT — OBLIGATORIO. Generar con: openssl rand -hex 32
      DOCSCAN_WEB_JWT__SECRET_KEY: ${DOCSCAN_WEB_JWT__SECRET_KEY:?define DOCSCAN_WEB_JWT__SECRET_KEY en .env — generar con openssl rand -hex 32}

      # Storage — MinIO como backend por defecto en Docker
      DOCSCAN_WEB_STORAGE__BACKEND: minio
      DOCSCAN_WEB_MINIO__ENDPOINT: minio:9000
      DOCSCAN_WEB_MINIO__ACCESS_KEY: ${MINIO_ROOT_USER}
      DOCSCAN_WEB_MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      # Redis (listo para ARQ)
      DOCSCAN_WEB_REDIS__URL: redis://redis:6379/0

      # General
      DOCSCAN_WEB_DEPLOY_MODE: ${DOCSCAN_WEB_DEPLOY_MODE:-onpremise}
      DOCSCAN_WEB_DEBUG: ${DOCSCAN_WEB_DEBUG:-false}
      DOCSCAN_WEB_CORS_ORIGINS: '["http://localhost:5173","http://localhost:5180"]'
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
